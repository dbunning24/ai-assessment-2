name: galaxy-morphology
channels:
    - pytorch
    - nvidia
    - conda-forge
    - defaults

dependencies:
    - python=3.11
    - numpy<2
    - pandas
    - scikit-learn
    - scipy
    - pillow
    - matplotlib
    - seaborn
    - umap-learn
    - hdbscan
    - tqdm
    - jupyter
    - ipykernel
    - tensorboard

    # --- PyTorch with CUDA 12.1 support (NVIDIA desktop) ---
    - pytorch=2.1
    - torchvision
    - torchaudio
    - pytorch-cuda=12.1

    - pip
